[GuruminModern]
; Keep simulation/gameplay at the engine's original speed.
InterpolateMotion=1
SmoothRhythm=1
Borderless=1
; Detailed pose/camera/timing measurements, disabled for ordinary play.
Diagnostics=0
; 0x0 preserves the installed/native resolution until a launcher choice is saved.
Width=0
Height=0
; 0 follows the original VSync setting; -1 uncapped; 30..1000 sets a numeric cap.
FrameCap=0
; Optional native orbit controls for Steam Input's selected gamepad.
FreeCamera=0
; Exclude only the main town exterior; buildings/dungeons still allow freecam.
CameraOutOfTownOnly=1
InvertCameraX=1
InvertCameraY=0
CameraYawSpeed=120
CameraPitchSpeed=90
CameraDeadzone=8689
; Square dynamic shadow capture; 256 original, 512, 1024 or 2048.
ShadowResolution=256
; 0 native, 1 FXAA Low, 2 FXAA High (scene before HUD).
AntiAliasing=0
; 1 native sampling, 0 nearest sampling for a pixelated asset look.
UIFiltering=1
WorldFiltering=1
; OpenXR VR (Monado or SteamVR). Also enabled for one launch by the -vr argument.
VREnabled=0
; 0 life size, 1 diorama (tabletop) scale.
VRScale=0
; Game units per real metre at life size; diorama shrinks the world further.
VRUnitsPerMeter=100
VRDioramaScale=12
; Rig placement: anchor (Parin) distance ahead of / height below the recentred head, metres.
VRLifeDistance=1.4
VRLifeHeight=0.9
VRDioramaDistance=0.45
VRDioramaHeight=0.25
; 1 snaps right-stick turns in 30 degree steps instead of turning smoothly.
VRSnapTurn=0
; Per-eye resolution multiplier on the runtime's recommendation, and its cap.
VRRenderScale=1.0
VRMaxEyeSize=3072
; HUD panel and flat-screen distance/width in metres.
VRHudDistance=1.4
VRHudWidth=1.5
VRScreenDistance=2.2
VRScreenWidth=2.4
; 1 also shows the game on the desktop window in VR. Off by default: a covered
; or hidden window is throttled by the compositor and would slow the game.
VRDesktopMirror=0
